[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "linker-post-api"
version = "0.1.0"
description = "Linker Post FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<46",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "PyJWT>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "uvicorn[standard]>=0.34,<1",
  "langgraph>=0.4,<1",
  "langchain-core>=0.3,<1",
  "langchain-google-genai>=2.0,<3",
  "langchain-openai>=0.3,<1",
  "langsmith>=0.3,<1",
  "ddgs>=9,<10",
  "beautifulsoup4>=4.13,<5",
  "lxml>=5,<6",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.9,<1",
]
content-planner = [
  "playwright>=1.49,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "agents", "scheduler"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
